<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elevate — Your Roadmap</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="../elevate.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
<style>
/* Notion-style layout (Akira, 2026-11-12): flat page, hairline dividers,
   to-do rows and toggle teaching instead of cards. Same classes and JS
   hooks as before; only the presentation changed. Palette is Notion dark
   (neutral grays) with the Elevate purple kept as the accent. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --black: #191919; --white: #ececec;
  --purple: #2f6d88; --purple-light: #7cc0d8;
  --purple-glow: rgba(63,134,166,.14); --purple-border: rgba(63,134,166,.36);
  --gray-900: #202020; --gray-850: #242424; --gray-800: #2a2a2a; --gray-700: #333333;
  --gray-600: #454545; --gray-400: #9b9b9b; --gray-300: #b8b8b8; --gray-200: #d3d3d3;
  --hair: rgba(255,255,255,.08); --wash: rgba(255,255,255,.04);
  --green: #2fd968; --green-bg: rgba(47,217,104,.12);
  --amber: #f5a524; --amber-bg: rgba(245,165,36,.1); --amber-border: rgba(245,165,36,.28);
  --r-sm: 6px; --r-md: 8px; --r-lg: 10px;
}
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  background: var(--black); color: var(--white); min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; padding: 0 1rem 6rem;
  -webkit-font-smoothing: antialiased; line-height: 1.55;
}
.wrap { width: 100%; max-width: 720px; position: relative; z-index: 1; }

/* --- top bar: quiet, like Notion's --- */
.bar {
  position: sticky; top: 0; z-index: 20; margin: 0 -1rem 1.2rem; padding: .65rem 1rem;
  background: rgba(25,25,25,.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--hair);
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
}
.bar-left { display: flex; align-items: center; gap: .6rem; min-width: 0; }
.bar-brand { font-size: 14px; font-weight: 300; letter-spacing: .26em; color: var(--white); flex-shrink: 0; }
.bar-count { font-size: 13.5px; font-weight: 500; color: var(--gray-300); white-space: nowrap; }
.bar-count .num { color: var(--white); font-weight: 600; }
.bar-right { display: flex; align-items: center; gap: .7rem; flex-shrink: 0; }
.bar-resume { font-size: 12.5px; font-weight: 500; color: var(--white); background: var(--wash); border: 1px solid var(--hair); border-radius: var(--r-sm); padding: .32rem .7rem; cursor: pointer; font-family: inherit; white-space: nowrap; }
.bar-resume:hover { background: rgba(255,255,255,.08); }
.bar-track { width: 72px; height: 4px; background: var(--gray-700); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: var(--purple-light); border-radius: 99px; transition: width .4s ease; }

.head { padding: 1.6rem 0 0; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gray-400); font-weight: 600; margin-bottom: .8rem; }
.sec-label { font-size: 13px; color: var(--gray-400); font-weight: 600; margin: 2.4rem 0 .6rem; padding-bottom: .45rem; border-bottom: 1px solid var(--hair); }
h1 { font-size: clamp(1.9rem, 5.5vw, 2.5rem); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin-bottom: .8rem; }
.lede { color: var(--gray-200); font-size: 15.5px; line-height: 1.7; margin-bottom: 1.4rem; }
.lede strong { color: #fff; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.8rem; }
.chip { font-size: 12.5px; font-weight: 500; padding: .28rem .6rem; border-radius: var(--r-sm); background: var(--wash); color: var(--gray-200); }
.chip.hi { background: var(--purple-glow); color: var(--purple-light); font-weight: 600; }

.callout { border-radius: var(--r-md); padding: .95rem 1.1rem; margin-bottom: 1.5rem; font-size: 14.5px; line-height: 1.7; background: var(--wash); }
.callout-title { font-weight: 600; font-size: 14.5px; margin-bottom: .35rem; }
.callout.speed { background: var(--purple-glow); }
.callout.speed .callout-title { color: var(--purple-light); }
.callout.warn { background: var(--amber-bg); color: var(--gray-200); }
.callout.warn .callout-title { color: var(--amber); }
.callout strong { color: #fff; }

/* --- overview: a Notion table, hairlines only --- */
.tbl { margin-bottom: 2rem; }
.tbl-crumb { font-size: 12.5px; color: var(--gray-400); padding: .2rem .3rem .6rem; }
.tbl-crumb span { color: var(--gray-200); }
.tbl-head, .tbl-row { display: grid; grid-template-columns: 1fr 104px 74px; gap: .8rem; align-items: center; padding: .5rem .3rem; }
.tbl-head { font-size: 12px; color: var(--gray-400); font-weight: 500; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.tbl-row { border-bottom: 1px solid var(--hair); cursor: pointer; font-size: 14.5px; border-radius: 4px; }
.tbl-row:hover { background: var(--wash); }
.tbl-name { display: flex; align-items: center; gap: .55rem; min-width: 0; }
.tbl-name b { font-weight: 500; letter-spacing: -.01em; }
.tbl-ico { width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--gray-400); }
.tbl-row.done-all .tbl-ico { color: var(--green); }
.tbl-row.current .tbl-ico { color: var(--purple-light); }
.tbl-status { font-size: 12px; font-weight: 500; padding: .14rem .5rem; border-radius: var(--r-sm); background: var(--wash); color: var(--gray-300); justify-self: start; white-space: nowrap; }
.tbl-status.go { background: var(--purple-glow); color: var(--purple-light); }
.tbl-status.ok { background: var(--green-bg); color: var(--green); }
.tbl-size { font-size: 12.5px; color: var(--gray-400); font-variant-numeric: tabular-nums; text-align: right; }
.tbl-foot { font-size: 12.5px; color: var(--gray-400); padding: .55rem .3rem 0; }

/* --- phases: Notion headings with toggles, not cards --- */
.phase { border-bottom: 1px solid var(--hair); padding-bottom: .6rem; margin-bottom: .6rem; scroll-margin-top: 64px; }
.phase-head { width: 100%; text-align: left; background: none; border: none; color: var(--white); font-family: inherit; padding: .7rem .3rem; cursor: pointer; display: flex; align-items: center; gap: .55rem; border-radius: 4px; }
.phase-head:hover { background: var(--wash); }
.phase-badge { width: 22px; font-size: 14px; font-weight: 600; color: var(--gray-400); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.phase.current .phase-badge { color: var(--purple-light); }
.phase.done-all .phase-badge { color: var(--green); }
.phase-txt { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; }
.phase-name { font-size: 19px; font-weight: 600; letter-spacing: -.015em; line-height: 1.3; }
.phase-meta { font-size: 12.5px; color: var(--gray-400); }
.phase-tag { font-size: 11px; font-weight: 600; color: var(--purple-light); background: var(--purple-glow); padding: .18rem .5rem; border-radius: var(--r-sm); white-space: nowrap; }
.phase-caret { color: var(--gray-400); font-size: 12px; transition: transform .25s ease; flex-shrink: 0; }
.phase.open .phase-caret { transform: rotate(180deg); }
.phase-body { display: none; padding: .2rem .3rem .8rem 1.9rem; }
.phase.open .phase-body { display: block; }
.phase-goal { font-size: 14px; color: var(--gray-200); background: var(--wash); border-radius: var(--r-md); padding: .85rem 1rem; margin-bottom: .9rem; line-height: 1.65; }

.task { display: flex; gap: .6rem; padding: .42rem .5rem; margin: 0 -.5rem; align-items: flex-start; border-radius: var(--r-sm); }
.task:hover { background: var(--wash); }
.task-box {
  width: 17px; height: 17px; border-radius: 3px; border: 1.5px solid #6f6f6f;
  background: transparent; flex-shrink: 0; cursor: pointer; margin-top: 3px;
  display: flex; align-items: center; justify-content: center; transition: all .16s ease; padding: 0;
}
.task-box:hover { border-color: var(--purple-light); }
.task-box.checked { background: var(--purple); border-color: var(--purple); }
.task-box.checked::after { content: '\2713'; color: #fff; font-size: 11px; font-weight: 700; line-height: 1; }
.task-main { flex: 1; min-width: 0; }
.task-text { font-size: 15px; line-height: 1.55; font-weight: 400; }
.task.checked .task-text { color: var(--gray-400); text-decoration: line-through; text-decoration-color: var(--gray-600); }
.task-row { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .3rem; align-items: center; }
.tlink {
  display: inline-flex; align-items: center; gap: .3rem; font-size: 12.5px; font-weight: 500;
  padding: .16rem .35rem; border-radius: 4px; cursor: pointer; font-family: inherit;
  background: none; border: none; color: var(--gray-400);
}
.tlink::before { content: '\25B8'; font-size: 10px; }
.tlink:hover { color: #fff; background: var(--wash); }
.track-tag { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; padding: .14rem .45rem; border-radius: var(--r-sm); background: var(--purple-glow); color: var(--purple-light); }
.track-tag.off { background: var(--wash); color: var(--gray-400); }

/* --- the teaching: plain page text under a toggle, the Notion way --- */
.teach { display: none; margin: .35rem 0 .6rem 1.75rem; }
.teach.open { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.teach p { font-size: 14.5px; color: var(--gray-200); line-height: 1.7; margin-bottom: .7rem; }
.teach p:last-child { margin-bottom: 0; }
.teach strong { color: #fff; font-weight: 600; }
.teach em { color: var(--purple-light); font-style: normal; font-weight: 500; }
.teach h5 { font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--white); font-weight: 600; margin: 1.15rem 0 .45rem; }
.teach ul { margin: 0 0 .7rem 1.1rem; }
.teach li { font-size: 14.5px; color: var(--gray-200); line-height: 1.65; margin-bottom: .3rem; }
.do { background: var(--purple-glow); border-radius: var(--r-md); padding: .8rem .95rem; font-size: 14px; line-height: 1.65; color: #fff; margin-top: .9rem; }
.do b { color: var(--purple-light); display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .25rem; }
.script { background: var(--gray-900); border-radius: var(--r-md); padding: .85rem .95rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.7; color: var(--gray-200); margin-bottom: .7rem; white-space: pre-wrap; word-break: break-word; }
.copy-btn { background: var(--wash); border: none; color: var(--gray-200); font-family: inherit; font-size: 11.5px; font-weight: 500; padding: .3rem .65rem; border-radius: var(--r-sm); cursor: pointer; }
.copy-btn:hover { background: rgba(255,255,255,.09); color: #fff; }

/* --- v2: scores panel, same hairline language as the table --- */
.scores { margin-bottom: .4rem; }
.score-row { display: grid; grid-template-columns: 132px 1fr 34px; gap: .8rem; align-items: center; padding: .42rem .3rem; border-bottom: 1px solid var(--hair); font-size: 14px; }
.score-name { font-weight: 500; color: var(--gray-200); white-space: nowrap; }
.score-row.weak .score-name { color: #fff; }
.score-tag { font-size: 10.5px; font-weight: 600; color: var(--purple-light); background: var(--purple-glow); padding: .12rem .4rem; border-radius: var(--r-sm); margin-left: .35rem; }
.score-bar { height: 6px; background: var(--gray-700); border-radius: 99px; overflow: hidden; }
.score-fill { display: block; height: 100%; background: var(--gray-400); border-radius: 99px; }
.score-row.weak .score-fill { background: var(--purple-light); }
#root.fx-bloom { animation: fxBloom 1.3s ease-out; border-radius: 14px; }
@keyframes fxBloom { 0% { box-shadow: 0 0 0 0 rgba(124,192,216,0); } 30% { box-shadow: 0 0 46px 6px rgba(124,192,216,.30); } 100% { box-shadow: 0 0 0 0 rgba(124,192,216,0); } }
.sfx-toggle { position: fixed; top: 12px; right: 12px; z-index: 80; background: rgba(21,26,38,.88); color: #eef1f8; border: 1px solid #2a3350; border-radius: 999px; padding: 7px 13px; font-size: 12.5px; font-family: inherit; cursor: pointer; }
.sfx-toggle:hover { border-color: #7cc0d8; }
@media (prefers-reduced-motion: reduce) { #root.fx-bloom { animation: none; } .score-fill { transition: none !important; } }
.score-num { font-variant-numeric: tabular-nums; color: var(--gray-300); text-align: right; font-weight: 600; }
.scores-note { font-size: 12.5px; color: var(--gray-400); margin-bottom: 1.6rem; line-height: 1.6; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; background: var(--purple); color: #fff; border: none; border-radius: var(--r-md); padding: .95rem 1.6rem; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all .18s ease; }
.btn:hover { background: var(--purple-light); }
.foot { text-align: center; margin-top: 2.5rem; padding-top: 1.6rem; border-top: 1px solid var(--hair); }
.foot p { font-size: 13.5px; color: var(--gray-400); line-height: 1.75; margin-bottom: 1rem; }
.foot p strong { color: #fff; }
.reset { background: none; border: none; color: var(--gray-600); font-family: inherit; font-size: 11.5px; cursor: pointer; text-decoration: underline; margin-top: 1.2rem; }
.reset:hover { color: var(--gray-400); }
@media (max-width: 560px) {
  .score-row { grid-template-columns: 108px 1fr 30px; }
  .phase-body { padding-left: .3rem; }
  .phase-tag { display: none; }
  .tbl-head, .tbl-row { grid-template-columns: 1fr 92px; }
  .tbl-size { display: none; }
}
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<!-- All 61 lessons (55 from Notion plus the v2 back-end phase). Separate
     file so the teaching can be re-pulled from
     Notion without touching any of the page logic below. -->
<script src="lessons.js"></script>
<script src="../elevate.js"></script>
<script>
/* ===========================================================================
   Offer to Client — the roadmap

   Everything is given away: all 61 items, with the teaching written inline
   rather than linked. The source modules live behind a members area, so a
   link would 404 for a lead; and inlining means the page is the asset.

   Access is gated: the page only opens from a personal link (the k= code
   the team sends on WhatsApp after the quiz) or on a device that already
   holds a completed profile. Inside the gate there is deliberately no
   deadline. Nothing locks, nothing expires. The motivator is progress and
   permanence, not a countdown.
   =========================================================================== */

var AKIRA = 'https://www.instagram.com/akira.ugc/';
var MAGNET = 'offer-to-client';
var PROFILE_KEY  = 'clp_offer_profile_v1';
var PROGRESS_KEY = 'clp_offer_progress_v1';

function readJSON(k, fallback) {
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

var profile = readJSON(PROFILE_KEY, null) || {};

/* The personal link carries the access code. Once seen, it lives in the
   profile, so the bookmarked page keeps opening on this device. */
(function takeAccessFromLink() {
  try {
    var km = (window.location.hash || '').match(/k=([^&]+)/);
    if (km && !profile.accessCode) {
      profile.accessCode = decodeURIComponent(km[1]);
      writeJSON(PROFILE_KEY, profile);
    }
  } catch (e) { /* no code on the link: the gate below decides */ }
})();

/* Somebody came back to it. Counted once per browser, which makes it the
   only honest measure of whether the roadmap was worth taking — a guide
   nobody opens twice did not land, and no click count will say so. */
if (window.Elevate) Elevate.step(MAGNET, 'open');

/* The plan can also arrive on the link, so opening the roadmap on another
   device still gets the right phase and track. Storage wins when it has
   something — it is the fuller record and carries their name. */
(function restoreFromLink() {
  try {
    var m = (window.location.hash || '').match(/r=([^&]+)/);
    if (!m || profile.phase !== undefined) return;
    var d = JSON.parse(atob(decodeURIComponent(m[1])));
    if (!d) return;
    profile.phase = d.p; profile.track = d.k; profile.price = d.pr;
    profile.sales = d.s; profile.tier = d.t; profile.country = d.c; profile.hours = d.h;
    if (d.sc) profile.scores = d.sc;
    if (d.ap) profile.aplus = d.ap;
    if (d.ag !== undefined) profile.aplusAgreed = d.ag;
    writeJSON(PROFILE_KEY, profile);
  } catch (e) { /* generic roadmap is fine */ }
})();

var progress   = readJSON(PROGRESS_KEY, {});
var entryPhase = profile.phase === undefined ? 0 : profile.phase;
var track      = profile.track || 'outbound';

/* Pricing guidance swaps on what they said they want to charge. Same task,
   different instruction — a $500 offer and a $5k offer are not sold the
   same way, and pretending otherwise is how advice stops landing. */
var PRICE_NOTE = {
  u500:      "You said under $500. At that price a sales call costs more than it earns — sell it in the DMs or with a simple checkout page, and treat this as the thing that funds the bigger offer later.",
  '500to2k': "You said $500–2k. This is the standard first-offer band: cheap enough to buy on one good call, expensive enough to be worth taking the call. Everything in this roadmap is tuned to it.",
  '2kto5k':  "You said $2–5k. Real high ticket. Expect two calls rather than one for a cold lead, and expect to need at least one named result before people stop flinching.",
  '5kplus':  "You said $5k+. You will not close this on promise alone. Until you have a documented result, either start lower and raise after your first win, or sell it as an offer to scale something that is already working."
};
var SALES_NOTE = {
  never:     "You have never closed on a call. That is the single biggest thing standing between you and money, so do not skim the closing lessons. They start from what to say in the first sixty seconds.",
  few:       "You have closed a handful but could not say why. The closing lessons are where that becomes repeatable instead of lucky.",
  regularly: "You already close. The closing lessons will be revision: skim them, then spend your time on the drills in the last one and on your content."
};

/* ===========================================================================
   v2: AREAS, SCORES AND ORDERING

   The full course stays: every lesson renders for everyone. What the quiz
   scores change is the order. Positioning becomes an unnumbered Foundations
   group that always sits on top. The four scored areas follow, with the A+
   area (the weakest, per resolveAplus in the quiz) numbered Phase 1 and the
   rest in canonical order behind it. Sales process is one area made of two
   original phases, Booked Calls and Closing, kept in their canonical order
   inside the area. Progress keys are untouched: every task keeps the id it
   had in the five-phase layout, so existing ticks survive the reorder.
   =========================================================================== */
var AREA_SHORT = { offer: 'Offer', sales: 'Sales', content: 'Content', backend: 'Back-end and AI' };
var AREA_CANON = ['offer', 'sales', 'content', 'backend'];
var APLUS_WORDS = { leads: 'getting leads', closing: 'closing clients', offer: 'the offer', systems: 'time and systems' };
var aplusArea = profile.aplus || null;

function tagTasks(ph) {
  return ph.tasks.map(function (t, i) {
    return { t: t.t, teach: t.teach, track: t.track, _id: taskId(ph.n, i) };
  });
}
var GROUPS = [];
if (typeof PHASE_0 !== 'undefined') {
  GROUPS = [
    { key: 'foundations', area: null, title: 'Foundations: positioning', goal: PHASE_0.goal, tasks: tagTasks(PHASE_0) },
    { key: 'offer', area: 'offer', title: PHASE_1.title, goal: PHASE_1.goal, tasks: tagTasks(PHASE_1) },
    { key: 'sales', area: 'sales', title: 'Booked calls and closing', goal: PHASE_2.goal + ' ' + PHASE_3.goal, tasks: tagTasks(PHASE_2).concat(tagTasks(PHASE_3)) },
    { key: 'content', area: 'content', title: PHASE_4.title, goal: PHASE_4.goal, tasks: tagTasks(PHASE_4) },
    { key: 'backend', area: 'backend',
      title: (typeof PHASE_5 !== 'undefined') ? PHASE_5.title : 'Back-end, delegation and AI',
      goal: (typeof PHASE_5 !== 'undefined') ? PHASE_5.goal : '',
      tasks: (typeof PHASE_5 !== 'undefined') ? tagTasks(PHASE_5) : [] }
  ];
}
function orderedGroups() {
  var areas = GROUPS.filter(function (g) { return g.area; });
  var rest = AREA_CANON.filter(function (a) { return a !== aplusArea; });
  var order = aplusArea ? [aplusArea].concat(rest) : AREA_CANON.slice();
  var sorted = order.map(function (a) {
    return areas.filter(function (g) { return g.area === a; })[0];
  }).filter(Boolean);
  sorted.forEach(function (g, i) { g.num = i + 1; });
  var found = GROUPS.filter(function (g) { return !g.area; });
  found.forEach(function (g) { g.num = null; });
  return found.concat(sorted);
}

/* ===========================================================================
   RENDER
   =========================================================================== */
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
function taskId(p, i) { return 'p' + p + 't' + i; }

/* A task tagged for the other track still renders — everything is given away.
   It is just marked so they know it is not their path. */
function visibleTasks(ph) { return ph.tasks; }

function totals() {
  var done = 0, all = 0;
  for (var p = 0; p < GROUPS.length; p++) {
    for (var i = 0; i < GROUPS[p].tasks.length; i++) { all++; if (progress[GROUPS[p].tasks[i]._id]) done++; }
  }
  return { done: done, all: all };
}
function phaseTotals(ph) {
  var done = 0;
  for (var i = 0; i < ph.tasks.length; i++) if (progress[ph.tasks[i]._id]) done++;
  return { done: done, all: ph.tasks.length };
}

/* First unfinished task, so "resume" lands somewhere useful on a 61-item page. */
function firstOpen() {
  var ordered = orderedGroups();
  for (var p = 0; p < ordered.length; p++) {
    var g = ordered[p];
    for (var i = 0; i < g.tasks.length; i++) {
      if (!progress[g.tasks[i]._id]) return { gid: g.key, id: g.tasks[i]._id };
    }
  }
  return null;
}

function renderTask(ph, task, i) {
  var id = task._id || taskId(ph.n, i);
  var checked = !!progress[id];
  var tag = '';
  if (task.track) {
    var mine = task.track === track;
    tag = '<span class="track-tag' + (mine ? '' : ' off') + '">' +
      (mine ? 'Your track &middot; ' : '') + task.track + '</span>';
  }
  return '<div class="task' + (checked ? ' checked' : '') + '" id="task-' + id + '">' +
    '<button class="task-box' + (checked ? ' checked' : '') + '" onclick="toggleTask(\'' + id + '\')" aria-label="Mark complete"></button>' +
    '<div class="task-main">' +
      '<div class="task-text">' + task.t + '</div>' +
      '<div class="task-row">' +
        '<button class="tlink" onclick="toggleTeach(\'' + id + '\',this)">Read it</button>' + tag +
      '</div>' +
      '<div class="teach" id="teach-' + id + '">' + task.teach + '</div>' +
    '</div></div>';
}

function renderPhase(g) {
  var pt = phaseTotals(g);
  var isAplus = !!g.area && g.area === aplusArea;
  var isFound = !g.area;
  var allDone = pt.done === pt.all;
  var body = g.goal ? '<div class="phase-goal">' + g.goal + '</div>' : '';
  for (var i = 0; i < g.tasks.length; i++) body += renderTask(g, g.tasks[i], i);
  var tag = isAplus ? '<span class="phase-tag">Phase 1 · your A+ problem</span>'
    : isFound ? '<span class="phase-tag">Do first</span>' : '';

  return '<div class="phase' + (isAplus ? ' current' : '') + ((isAplus || isFound) ? ' open' : '') + (allDone ? ' done-all' : '') + '" id="phase-' + g.key + '">' +
    '<button class="phase-head" onclick="togglePhase(\'' + g.key + '\')">' +
      '<span class="phase-badge">' + (allDone ? '&#10003;' : (g.num ? g.num : '&#10022;')) + '</span>' +
      '<span class="phase-txt">' +
        '<span class="phase-name">' + g.title + tag + '</span>' +
        '<span class="phase-meta">' + pt.done + ' of ' + pt.all + ' done</span>' +
      '</span>' +
      '<span class="phase-caret">&#9660;</span>' +
    '</button>' +
    '<div class="phase-body">' + body + '</div></div>';
}

function renderTable(ordered) {
  var rows = '';
  for (var i = 0; i < ordered.length; i++) {
    var g = ordered[i], pt = phaseTotals(g);
    var allDone = pt.done === pt.all;
    var isAplus = !!g.area && g.area === aplusArea;
    var status = allDone ? '<span class="tbl-status ok">Done</span>'
      : pt.done > 0 ? '<span class="tbl-status go">In progress</span>'
      : isAplus ? '<span class="tbl-status go">Phase 1</span>'
      : !g.area ? '<span class="tbl-status go">Do first</span>'
      : '<span class="tbl-status">Unlocked</span>';
    rows += '<div class="tbl-row' + (allDone ? ' done-all' : '') + (isAplus ? ' current' : '') +
      '" onclick="jumpTo(\'' + g.key + '\')">' +
      '<span class="tbl-name"><span class="tbl-ico">' + (allDone ? '&#10003;' : (g.num ? g.num : '&#10022;')) + '</span><b>' + g.title + '</b></span>' +
      status +
      '<span class="tbl-size">' + pt.all + ' items</span>' +
      '</div>';
  }
  var t = totals();
  return '<div class="tbl">' +
    '<div class="tbl-crumb">Elevate &rsaquo; <span>The whole thing</span></div>' +
    '<div class="tbl-head"><span>Phase</span><span>Status</span><span style="text-align:right">Size</span></div>' +
    rows +
    '<div class="tbl-foot">' + t.all + ' items &middot; nothing locked &middot; no expiry</div>' +
    '</div>';
}

function renderScores() {
  var sc = profile.scores;
  if (!sc) return '';
  var rows = '';
  for (var i = 0; i < AREA_CANON.length; i++) {
    var a = AREA_CANON[i], v = sc[a];
    if (typeof v !== 'number') return '';
    var weak = aplusArea === a;
    rows += '<div class="score-row' + (weak ? ' weak' : '') + '">' +
      '<span class="score-name">' + AREA_SHORT[a] + (weak ? '<span class="score-tag">Phase 1</span>' : '') + '</span>' +
      '<span class="score-bar"><span class="score-fill" style="width:' + v + '%"></span></span>' +
      '<span class="score-num">' + v + '</span></div>';
  }
  return '<div class="sec-label">Your scores</div>' +
    '<div class="scores">' + rows + '</div>' +
    '<p class="scores-note">Scored out of 100 from your quiz answers. Higher is stronger. Your lowest score leads the roadmap; nothing is removed, the full course is all here.</p>';
}

function renderRationale() {
  var sc = profile.scores;
  if (!sc || !aplusArea) return '';
  var pickWords = (profile.answers && profile.answers.q10) ? APLUS_WORDS[profile.answers.q10] : null;
  var txt;
  if (profile.aplusAgreed && pickWords) {
    txt = 'You told us the one thing you would fix first is <strong>' + pickWords + '</strong>. Your answers back that up: your ' +
      AREA_SHORT[aplusArea] + ' score is <strong>' + sc[aplusArea] + ' out of 100</strong>, the lowest of your four. So that area is your Phase 1, and the rest of the course follows in the order that gets it fixed fastest.';
  } else if (pickWords && profile.aplusPick && sc[profile.aplusPick] !== undefined) {
    txt = 'You told us the one thing you would fix first is <strong>' + pickWords + '</strong>. Your answers tell a slightly different story: your ' +
      AREA_SHORT[aplusArea] + ' score is <strong>' + sc[aplusArea] + ' out of 100</strong>, lower than your ' + AREA_SHORT[profile.aplusPick] + ' score of ' + sc[profile.aplusPick] +
      '. The lower score wins, so <strong>' + AREA_SHORT[aplusArea] + '</strong> is your Phase 1. Your pick is still in the roadmap in its natural place; it is just not the first fire to put out.';
  } else {
    txt = 'Your answers scored your ' + AREA_SHORT[aplusArea] + ' lowest, at <strong>' + sc[aplusArea] + ' out of 100</strong>, so that area is your Phase 1. The rest of the course follows in the order that gets it fixed fastest.';
  }
  return '<div class="callout speed"><div class="callout-title">Why your roadmap looks like this</div><p>' + txt + '</p></div>';
}

function render() {
  var t = totals();
  var pct = t.all ? Math.round((t.done / t.all) * 100) : 0;
  var name = profile.firstName ? esc(profile.firstName) : null;

  var chips = '';
  if (profile.country) chips += '<span class="chip">' + esc(profile.country) + '</span>';
  if (aplusArea && AREA_SHORT[aplusArea]) chips += '<span class="chip hi">Phase 1: ' + esc(AREA_SHORT[aplusArea]) + '</span>';
  else if (profile.phase !== undefined) chips += '<span class="chip hi">Starting at ' + esc(PHASES[entryPhase] ? PHASES[entryPhase].title : 'Positioning') + '</span>';
  chips += '<span class="chip">' + (track === 'outbound' ? 'Outbound track' : 'Inbound track') + '</span>';
  if (profile.price && PRICE_NOTE[profile.price]) {
    chips += '<span class="chip">' + esc({ u500: 'Under $500', '500to2k': '$500–2k', '2kto5k': '$2k–5k', '5kplus': '$5k+' }[profile.price]) + '/client</span>';
  }

  var tierWarning = (profile.tier && profile.tier > 1)
    ? '<div class="callout warn"><div class="callout-title">About the numbers in here</div>' +
      'You told us you are in <strong>' + esc(profile.country || 'a non-T1 market') + '</strong>. Every price in this roadmap assumes T1 clients. The method works from anywhere &mdash; what changes is who you point it at. The outbound track in Phase 2 is how you reach T1 clients from where you are, and it is worth treating that as the main event rather than selling locally at local prices.</div>'
    : '';

  var guidance = '';
  if (profile.price && PRICE_NOTE[profile.price]) guidance += '<p>' + PRICE_NOTE[profile.price] + '</p>';
  if (profile.sales && SALES_NOTE[profile.sales]) guidance += '<p>' + SALES_NOTE[profile.sales] + '</p>';

  document.getElementById('root').innerHTML =
    '<div class="bar">' +
      '<div class="bar-left"><span class="bar-brand">elevate</span>' +
        '<span class="bar-count"><span class="num">' + t.done + ' of ' + t.all + '</span> done</span>' +
      '</div>' +
      '<div class="bar-right">' +
        (t.done > 0 ? '<button class="bar-resume" onclick="resume()">Resume</button>' : '') +
        '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
      '</div>' +
    '</div>' +

    '<div class="head">' +
      '<div class="eyebrow">Elevate</div>' +
      '<h1>' + (name ? name + ', here is the whole thing.' : 'Here is the whole thing.') + '</h1>' +
      '<p class="lede">All ' + t.all + ' lessons, every script, written out in full. <strong>Nothing is locked and nothing expires.</strong> Work through it at whatever pace you will actually sustain, and come back to it whenever.</p>' +
      (chips ? '<div class="chips">' + chips + '</div>' : '') +
    '</div>' +

    renderTable(orderedGroups()) +

    renderScores() +
    renderRationale() +
    (guidance ? '<div class="callout speed"><div class="callout-title">Two things specific to you</div>' + guidance + '</div>' : '') +
    tierWarning +

    '<div class="sec-label">The roadmap</div>' +
    orderedGroups().map(renderPhase).join('') +

    '<div class="foot">' +
      '<p><strong>Bookmark this page.</strong> Your ticks are saved in this browser, so come back to the same one and everything is where you left it. Open it somewhere else and you will get your plan, but the ticks start fresh.</p>' +
      '<p>Stuck on something? DM me. That is the whole reason this is free &mdash; if it works for you, I would rather you came to me when you want to go further.</p>' +
      '<a class="btn" href="' + esc(AKIRA) + '" target="_blank" rel="noopener">DM Akira on Instagram</a>' +
      '<div><button class="reset" onclick="resetAll()">Reset my progress</button></div>' +
    '</div>';
}

/* --- interaction --- */
function toggleTask(id) {
  progress[id] = !progress[id];
  writeJSON(PROGRESS_KEY, progress);
  syncProgress();
  // Re-render rather than patch: the counters, the badges and the overview
  // table all key off the same numbers, and keeping them in sync by hand is
  // how they drift apart. Open panels and scroll position are restored.
  var openPhases = [], openTeach = [];
  document.querySelectorAll('.phase.open').forEach(function (e) { openPhases.push(e.id); });
  document.querySelectorAll('.teach.open').forEach(function (e) { openTeach.push(e.id); });
  var y = window.scrollY;
  render();
  openPhases.forEach(function (pid) { var e = document.getElementById(pid); if (e) e.classList.add('open'); });
  openTeach.forEach(function (tid) {
    var e = document.getElementById(tid);
    if (e) {
      e.classList.add('open');
      var btn = e.parentNode.querySelector('.tlink');
      if (btn) btn.textContent = 'Hide';
    }
  });
  window.scrollTo(0, y);
}
function togglePhase(n) { document.getElementById('phase-' + n).classList.toggle('open'); }
function toggleTeach(id, btn) {
  var el = document.getElementById('teach-' + id);
  if (!el) return;
  el.classList.toggle('open');
  if (btn) btn.textContent = el.classList.contains('open') ? 'Hide' : 'Read it';
}
function jumpTo(n) {
  var el = document.getElementById('phase-' + n);
  if (!el) return;
  el.classList.add('open');
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function resume() {
  var spot = firstOpen();
  if (!spot) return;
  var ph = document.getElementById('phase-' + spot.gid);
  if (ph) ph.classList.add('open');
  var t = document.getElementById('task-' + spot.id);
  if (t) t.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function copyScript(btn) {
  var code = btn.previousElementSibling;
  while (code && !code.classList.contains('script')) code = code.previousElementSibling;
  if (!code) return;
  var text = code.textContent;
  var done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () {});
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
}
function resetAll() {
  if (!confirm('Clear every tick on this roadmap? The content stays, obviously.')) return;
  progress = {}; writeJSON(PROGRESS_KEY, progress); syncProgress(); render();
}

/* --- progress sync -----------------------------------------------------------
   The team can only help with progress they can see, so ticks are mirrored
   to the CRM, keyed by the same access code that opened the gate. Fire and
   forget: if the endpoint is down or not live yet, the page never notices.
   Writes only, nothing is read back. */
var PROGRESS_API = 'https://creator-launchpad-content-infrastru.vercel.app/api/leads/progress';
var progressSyncTimer = null;
function syncProgress() {
  if (!profile.accessCode && !profile.email) return;
  if (progressSyncTimer) clearTimeout(progressSyncTimer);
  progressSyncTimer = setTimeout(function () {
    try {
      var t = totals();
      var doneIds = [];
      for (var p = 0; p < GROUPS.length; p++)
        for (var i = 0; i < GROUPS[p].tasks.length; i++)
          if (progress[GROUPS[p].tasks[i]._id]) doneIds.push(GROUPS[p].tasks[i]._id);
      fetch(PROGRESS_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          accessCode: profile.accessCode || null,
          email: profile.email || null,
          doneIds: doneIds,
          doneCount: t.done,
          totalCount: t.all,
          at: new Date().toISOString()
        }),
        keepalive: true
      }).catch(function () {});
    } catch (e) { /* progress sync must never break the page */ }
  }, 800);
}

/* --- the gate ---------------------------------------------------------------
   A bare visit gets the wall, not the roadmap: no lessons, no phases, just
   where theirs comes from. A completed profile from before the gate counts
   as access on that device; those leads already gave their details and
   locking them out of their own roadmap would be petty. */
function hasAccess() {
  return !!(profile.accessCode || profile.access || profile.email);
}
function renderGate() {
  document.getElementById('root').innerHTML =
    '<div style="max-width:580px;margin:0 auto;padding:4.5rem 1rem 3rem;text-align:center">' +
      '<div class="eyebrow">Elevate</div>' +
      '<h1>This roadmap is personal, so it is not just sitting open.</h1>' +
      '<p class="lede">Everyone who gets one has theirs built from a short quiz, and our team sends it to them on WhatsApp personally. If you have already done the quiz, your link is in your WhatsApp messages. If you have not, it takes about two minutes and it is free.</p>' +
      '<a class="btn" href="./">Get my roadmap</a>' +
      '<p class="lede" style="margin-top:1.4rem;font-size:13px">Already waiting on yours? The team sends them in batches through the day. Give it a little time, then check WhatsApp again.</p>' +
    '</div>';
}

// lessons.js carries every lesson. If it fails to load, say so rather
// than rendering an empty page that looks like the roadmap is broken.
if (typeof PHASES === "undefined") {
  document.getElementById("root").innerHTML =
    '<div style="padding:4rem 1rem;text-align:center">' +
    '<h1>Could not load the roadmap</h1>' +
    '<p class="lede">Refresh the page. If it keeps happening, DM Akira and he will sort it.</p></div>';
} else if (!hasAccess()) {
  renderGate();
} else {
  render();
  syncProgress();
}
</script>

<script>
/* SFX wiring for the roadmap: tick on lesson tick, and the first-view
   celebration (score stagger, one confetti burst, unlock bloom when the
   personal link has just opened the gate). Browsers block audio before
   the first touch, so the sounds join on the first pointerdown while
   the visuals run straight away. */
(function () {
  var S = window.ElevateSfx; if (!S) return;
  var reduced = S.reduced();
  var tt = window.toggleTask;
  if (typeof tt === 'function') window.toggleTask = function (id) {
    var was = false, now = false;
    try { was = !!progress[id]; } catch (e) {}
    tt(id);
    try { now = !!progress[id]; } catch (e) {}
    if (!was && now) S.tick();
  };
  if (!document.querySelector('.task')) return;
  var profile = {};
  try { profile = JSON.parse(localStorage.getItem('clp_offer_profile_v1') || '{}'); } catch (e) {}
  var hasScores = !!profile.scores;
  var firstView = false;
  try { firstView = !localStorage.getItem('clp_fx_celebrated_v1'); } catch (e) {}
  var justUnlocked = false;
  try {
    justUnlocked = /[&#]k=/.test(window.location.hash || '') && !sessionStorage.getItem('clp_fx_unlock_seen');
    if (justUnlocked) sessionStorage.setItem('clp_fx_unlock_seen', '1');
  } catch (e) {}
  if (justUnlocked && !reduced) {
    var root = document.getElementById('root');
    if (root) root.classList.add('fx-bloom');
  }
  function fxBurst() {
    try {
      var anchorEl = document.querySelector('.scores') || document.getElementById('root');
      var r = anchorEl.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = Math.max(r.top + r.height / 2, 70);
      var c = document.createElement('canvas');
      c.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:99';
      c.width = window.innerWidth; c.height = window.innerHeight;
      document.body.appendChild(c);
      var g = c.getContext('2d');
      var cols = ['#7cc0d8', '#2f6d88', '#f5a524', '#e8eef6'];
      var ps = [];
      for (var i = 0; i < 44; i++) {
        var a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 7;
        ps.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, s: 3 + Math.random() * 5, col: cols[i % 4], rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .3 });
      }
      var t0 = performance.now();
      (function frame(t) {
        var el = (t - t0) / 1000;
        g.clearRect(0, 0, c.width, c.height);
        for (var j = 0; j < ps.length; j++) {
          var p = ps[j];
          p.x += p.vx; p.y += p.vy; p.vy += .29; p.vx *= .99; p.rot += p.vr;
          g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
          g.globalAlpha = Math.max(1 - el / 1.5, 0);
          g.fillStyle = p.col; g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .62);
          g.restore();
        }
        if (el < 1.5) requestAnimationFrame(frame); else c.remove();
      })(t0);
    } catch (e) {}
  }
  if (firstView) {
    if (hasScores && !reduced) {
      var fills = document.querySelectorAll('.score-fill');
      for (var i = 0; i < fills.length; i++) (function (f, idx) {
        f.style.transformOrigin = '0 50%';
        f.style.transform = 'scaleX(0)';
        f.style.transition = 'transform .7s cubic-bezier(.4,0,.2,1) ' + (idx * .13) + 's';
        requestAnimationFrame(function () { requestAnimationFrame(function () { f.style.transform = 'scaleX(1)'; }); });
      })(fills[i], i);
      var weak = document.querySelector('.score-row.weak .score-fill');
      if (weak) weak.style.boxShadow = '0 0 12px rgba(124,192,216,.55)';
    }
    if (!reduced) fxBurst();
    try { localStorage.setItem('clp_fx_celebrated_v1', '1'); } catch (e) {}
  }
  var sounded = false;
  document.addEventListener('pointerdown', function () {
    if (sounded) return; sounded = true;
    if (justUnlocked) { S.play('unlock', null, true); S.play('chime', 0.15, true); }
    if (firstView) {
      if (hasScores && !justUnlocked) S.play('chime', null, true);
      setTimeout(function () { S.play('win', null, true); }, justUnlocked ? 550 : 320);
    }
  }, false);
})();
